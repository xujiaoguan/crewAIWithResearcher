research_task:
  description: >
    围绕选题「{topic}」开展面向本科毕业论文深度的调研与素材整理（不是短讯或公众号风格）。
    调研要求：
    1）若可用联网搜索工具：请从不同角度设计不少于 6 次检索（可包含：综述/ survey、官方文档、开源实现、标准或 RFC、产业报告、中文权威解读、英文关键词等），每次检索后筛选高质量结果；
    2）对每条拟纳入文献表的来源，记录：题名、责任者（个人/机构/项目组）、文献类型（期刊/会议/学位论文/专著/电子文献/技术报告/标准/网页等）、年份或更新日期、完整 URL、以及 1–2 句对你论文最有用的摘录或概括；
    3）梳理「研究现状」可用的脉络：代表性工作、主要流派、共识与分歧、技术瓶颈与研究空白（至少 4 条，带简要论据）；
    4）给出可支撑正文「方法/技术路线」或「系统/实验设计」的要点（若选题偏理论则给出模型/假设与验证思路）；
    5）给出 2–3 个可用 Markdown 表格呈现的对比维度建议（例如不同方案在性能/成本/可维护性/生态上的对比），并在表格前用文字说明指标含义与数据来源局限。
    禁止编造链接；无可靠出处的内容只能放在「待核实笔记」小节，不得混入正式文献表。
  expected_output: >
    一份结构化中文调研笔记（建议使用 Markdown 标题分级），必须包含以下区块（标题字面一致或语义等价即可）：
    -「检索策略与关键词」：列出用过的检索词及目的；
    -「研究脉络与研究空白」：不少于 800 字，分点论述并尽量引用你下面文献表中的编号占位（如 [R1]）；
    -「支撑正文的论据与数据要点」：分点列出，可与技术对比相关；
    -「建议用于正文的表格草稿」：至少 1 个 Markdown 表格（含表题），表内数据若来自网页请注明对应文献编号；
    -「参考文献表（调研阶段，GB/T 7714 电子文献常见要素）」：Markdown 表格，列至少包含：
      序号 | 文献类型 | 主要责任者 | 题名 | 出版/发布信息（期刊名/会议名/出版地:出版者/网站名等，能填则填） | 年/日期 | URL | 引用日期（YYYY-MM-DD）
    其中 URL 列必须来自真实检索到的链接；文献条数不少于 10 条、不多于 25 条；序号从 1 连续编号。
    若当前环境未配置检索 API 导致无法联网：在文首用单独一行说明原因，参考文献表仅列「可手动核实的公开书目线索」（仍不得伪造 URL），并显著提示「正式论文提交前须替换为可检索文献」。
  agent: researcher
  output_file: output/research_notes.md

reporting_task:
  description: >
    在上一任务《调研笔记》的基础上，撰写一篇面向本科毕业论文体例的深度专题论文（Markdown），选题中心仍为「{topic}」。
    写作要求：
    1）全文须为中文（专有名词、模型名、API 名可保留英文），总字数建议 4500–8000 字（以充实为准，避免灌水重复）；
    2）正文引用须使用顺序编码角标 [1][2]…，与文末「参考文献」表序号严格一一对应；不得出现正文引用在参考文献中找不到的情况；
    3）参考文献表必须与调研员提供的真实 URL 文献一致：可合并去重、可调整著录格式细目，但不得新增调研员未给出过的 URL，也不得删除导致正文引用失配；
    4）若调研员注明未配置检索：保持其风险提示，参考文献表沿用其「线索表」，正文引用改为「待补充」类表述并减少强断言；
    5）须调用工具 saveText2Pdf：将本任务最终完整 Markdown 正文（从第一个一级标题到参考文献表结束）作为参数 text 传入，filename 使用 report.pdf，以便生成 output/report.pdf。
  expected_output: >
    一份完整的 Markdown 论文文件内容（将写入 output/report.md），结构必须依次包含（使用 Markdown # / ## / ### 标题）：
    - 一级标题：论文题目（需体现 {topic}，学术化表述）
    - 「摘要」：200–400 字，概括背景、方法/对象、主要结果与结论；其后单独一行「关键词：」列出 3–6 个关键词，用中文分号分隔
    - 「Abstract」与「Keywords:」：与中文摘要对应的英文摘要与关键词（允许简明，不必机器翻译腔）
    - 「目录」：列出二级及以上标题及页码占位（页码可统一写「见排版稿」或省略，但章节名要完整）
    - 「绪论」：含研究背景与意义、国内外研究现状（本处写浓缩版，与后文综述呼应）、论文结构说明
    - 「国内外研究现状与相关技术」（文献综述）：不少于 1200 字，分小节梳理，穿插对代表性工作的评价
    - 「主体章节」：至少两节（如「方法与模型 / 系统设计与实现」「实验与结果分析」或等价结构），根据选题性质自选标题；其中必须包含至少 2 个 Markdown 表格（其一可为与调研笔记不同的新表，但数据须仍可追溯至所给文献）
    - 「结论与展望」：总结贡献、局限与未来工作
    - 「参考文献」：再次给出与正文引用一致的 Markdown 表格（列：序号、文献类型、主要责任者、题名、出处、年、URL、引用日期），条数与编号与正文一致
    全文逻辑须像本科论文：有问题提出、有文献支撑、有分析比较、有结论，避免广告化与空泛形容词堆砌。
  agent: reporting_writer
  output_file: output/report.md
